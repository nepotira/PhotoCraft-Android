name: Build Android APK

on:
  push:
    branches: [ main, android ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  build-apk:
    name: Build PhotoCraft Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images || true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
            echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
            echo "Using NDK at $NDK_DIR"
          fi

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install cargo-apk
        run: |
          if ! command -v cargo-apk &> /dev/null; then
            cargo install cargo-apk --locked
          fi

      - name: Ensure Release Keystore
        run: |
          if [ ! -f apps/photocraft-android/release.keystore ]; then
            echo "Generating fallback release keystore..."
            keytool -genkey -v -keystore apps/photocraft-android/release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=PhotoCraft, OU=Nepo, O=ArtCraft, C=BR"
          else
            echo "Using persistent release keystore from repository."
          fi

      - name: Compile DropHelper DEX
        run: |
          mkdir -p /tmp/drop_classes
          mkdir -p apps/photocraft-android/assets
          PLATFORM_JAR=$(ls $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -n 1)
          D8_TOOL=$(ls $ANDROID_HOME/build-tools/*/d8 | sort -V | tail -n 1)
          echo "Using platform jar: $PLATFORM_JAR"
          echo "Using d8 tool: $D8_TOOL"
          javac -source 8 -target 8 -bootclasspath "$PLATFORM_JAR" \
            apps/photocraft-android/java/ai/storyteller/photocraft/DropHelper.java \
            -d /tmp/drop_classes
          "$D8_TOOL" /tmp/drop_classes/ai/storyteller/photocraft/*.class \
            --output apps/photocraft-android/assets/
          ls -la apps/photocraft-android/assets/

      - name: Build PhotoCraft APK (ARM64 & x86_64)
        run: |
          mkdir -p build-artifacts
          echo "Compiling ARM64 APK for mobile devices and tablets..."
          cargo apk build --package photocraft-android --release --target aarch64-linux-android
          cp target/release/apk/photocraft-android.apk build-artifacts/PhotoCraft-Android-arm64-v8a.apk

          echo "Compiling x86_64 APK for Chromebooks / Googlebook OS..."
          cargo apk build --package photocraft-android --release --target x86_64-linux-android
          cp target/release/apk/photocraft-android.apk build-artifacts/PhotoCraft-Android-x86_64.apk

      - name: List Output Files
        run: |
          ls -lh build-artifacts/
          find target -name "*.apk" -ls

      - name: Upload PhotoCraft APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-android-apks
          path: build-artifacts/*.apk
          retention-days: 30
