[package]
name = "photocraft-android"
description = "PhotoCraft Android & Googlebook OS v0.1.8 (pure desktop experience) by Nepo"
version = "0.1.8"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[package.metadata.android]
package = "ai.storyteller.photocraft"
apk_label = "PhotoCraft"
icon = "@mipmap/ic_launcher"
resources = "res"
assets = "assets"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.application]
label = "PhotoCraft"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
label = "PhotoCraft"
icon = "@mipmap/ic_launcher"
resizeable_activity = true

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.EDIT", "android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "image/vnd.adobe.photoshop"
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "image/x-photoshop"
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "application/x-photoshop"
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "application/photoshop"
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "image/psd"
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "image/x-psd"
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "image/png"
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "image/jpeg"
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "image/webp"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.EDIT"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "application/octet-stream"
path_pattern = ".*\\.psd"
[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "application/octet-stream"
path_pattern = ".*\\.PSD"
[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "file"
mime_type = "application/octet-stream"
path_pattern = ".*\\.psd"
[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "file"
mime_type = "application/octet-stream"
path_pattern = ".*\\.PSD"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.EDIT"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "*/*"
path_pattern = ".*\\.psd"
[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "*/*"
path_pattern = ".*\\.PSD"
[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "file"
mime_type = "*/*"
path_pattern = ".*\\.psd"
[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "file"
mime_type = "*/*"
path_pattern = ".*\\.PSD"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "android"
key_alias = "androidkey"
key_password = "android"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, default-features = false, features = ["wgpu", "android-native-activity", "default_fonts"] }
winit = { version = "0.30", features = ["android-native-activity"] }
log = { workspace = true }
android_logger = "0.14"
jni = "0.21"
