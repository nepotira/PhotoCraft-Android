[package]
name = "photocraft-android"
description = "PhotoCraft on Android (eframe NativeActivity runner)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[package.metadata.android]
package = "ai.storyteller.photocraft"
apk_label = "PhotoCraft"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[lints]
workspace = true

[dependencies]
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, default-features = false, features = ["wgpu", "android-native-activity", "default_fonts"] }
winit = { version = "0.30", features = ["android-native-activity"] }
log = { workspace = true }
android_logger = "0.14"
